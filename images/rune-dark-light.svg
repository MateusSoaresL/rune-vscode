<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <defs>
    <!-- Gradiente da Runa (Roxo Neon para Ciano) -->
    <linearGradient id="runeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>

    <!-- Cor do Hexágono (Azul Escuro/Neon) -->
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D46FF"/>
      <stop offset="100%" stop-color="#3A0CA3"/>
    </linearGradient>
    
    <!-- Efeito de brilho neon (Glow) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Escudo Hexagonal com fundo escuro por dentro e transparente por fora -->
  <polygon points="50,5 89,27.5 89,72.5 50,95 11,72.5 11,27.5" fill="#050508" stroke="url(#hexGrad)" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Letra R Rúnica (Raido) com cantos arredondados -->
  <path d="M 35 75 L 35 25 L 65 40 L 35 55 L 65 75" fill="none" stroke="url(#runeGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
